---
name: Build and Push Image to ECR

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  AWS_REPOSITORY: moneyflow/api

jobs:
  build-push-release:
    name: Build and Push to ECR (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.production file
        run: echo "${{ vars.ENV_PRODUCTION }}" > apps/server/.env.production

      - name: Resolve release version
        id: version
        run: echo "release_version=release-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_REPOSITORY }}:${{ steps.version.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-staging:
    name: Build and Push to ECR (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.staging file
        run: echo "${{ vars.ENV_STAGING }}" > apps/server/.env.staging

      - name: Resolve staging version
        id: version
        run: echo "release_version=staging-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile.dev
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_REPOSITORY }}:${{ steps.version.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Publishes the Docker images to GitHub Container Registry.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes 1.2.3, v1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Images:
#   ghcr.io/<owner>/cloudrive   the Go API serving the web app and the S3 gateway (apps/server + apps/web)
#   ghcr.io/<owner>/cloudrive/docs  apps/docs (this documentation site)

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  # The api Dockerfile builds GOARCH=amd64 binaries.
  PLATFORMS: linux/amd64

jobs:
  release-images:
    name: Release ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both install from the workspace lockfile, so they build from the root.
          - image: cloudrive
            file: apps/server/Dockerfile
          - image: cloudrive/docs
            file: apps/docs/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # One cache scope per image, or the builds evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

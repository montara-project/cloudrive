# Opens a "chore: release vX.Y.Z" PR carrying the version bump and changelog.
#
# Run it manually on main (Actions → Release Prepare). `increment: auto` lets
# @release-it/conventional-changelog derive the bump from conventional commits
# since the last tag. Merging the PR triggers release-publish.yml, which tags
# the merge commit and creates the GitHub release.

name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (auto derives it from conventional commits)
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

# One release prep at a time; never cancel — a killed run leaves a stray commit.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# The repo's husky hooks are for local work: pre-push runs the full workspace
# build, which this root-only install cannot do (no apps' node_modules). With
# HUSKY=0, `pnpm install` installs no hooks, so release-it's commit and the
# PR branch push run without them.
env:
  HUSKY: 0

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history — the conventional-changelog plugin diffs against the
          # previous tag to compute the bump and the release notes.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Root only: release-it and its plugin are root devDependencies, and the
      # workspace install would also run `go mod tidy` for apps/server.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cloudrive

      # The dispatch input goes through an env var, never direct ${{ }}
      # interpolation into the shell: an API-dispatched run is not bound to
      # the input's `choice` restriction, so interpolation here would be a
      # command-injection primitive for anyone with workflow_dispatch rights.
      - name: Bump version and changelog
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          if [ "$INCREMENT" = "auto" ]; then
            pnpm release:prepare
          else
            pnpm release:prepare --increment "$INCREMENT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          title: 'chore: release v${{ steps.bump.outputs.version }}'
          labels: release
          delete-branch: true
          body: |
            Release **v${{ steps.bump.outputs.version }}** — version bump and changelog generated by release-it.

            Merging this PR tags `v${{ steps.bump.outputs.version }}`, creates the GitHub release, and dispatches the Docker image builds (api + docs).
